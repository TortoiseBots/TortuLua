name: engine-tests
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (standalone, no ForeverCore)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sanitizers
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DFOREVER_LUA_SANITIZE=ON
          cmake --build build-asan -j 4
          ctest --test-dir build-asan --output-on-failure
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ThreadSanitizer)
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DFOREVER_LUA_TSAN=ON
      - name: Build
        run: cmake --build build-tsan -j 4
      - name: Test
        run: setarch -R ctest --test-dir build-tsan -R '^bot' --output-on-failure
