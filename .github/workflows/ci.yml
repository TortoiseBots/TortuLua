name: engine-tests
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (standalone, no ForeverCore)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sanitizers
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DFOREVER_LUA_SANITIZE=ON
          cmake --build build-asan -j 4
          ctest --test-dir build-asan --output-on-failure
  public-text:
    # No private or internal text may reach this public repository: run on every
    # pull request and on dev/main. GitHub-hosted runner, no secrets.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the checker
        run: python3 tests/tools/test_check_public_text.py
      - name: Check tracked text and commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            args+=(--base "$BASE_SHA")
          fi
          python3 tools/check_public_text.py "${args[@]}"
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ThreadSanitizer)
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DFOREVER_LUA_TSAN=ON
      - name: Build
        run: cmake --build build-tsan -j 4
      - name: Test
        run: setarch -R ctest --test-dir build-tsan -R '^bot' --output-on-failure
